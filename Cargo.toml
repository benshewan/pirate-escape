[package]
name = "pirate-escape"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies.bevy]
version = "0.20"
default-features = false
features = ["2d", "ui", "audio"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"

# Fast iteration on the game code, optimized dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Small/fast browser bundle: `cargo`/trunk --profile wasm-release
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
